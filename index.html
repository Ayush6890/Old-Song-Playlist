<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Old Melodies</title>

    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="uitility.css">

    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"
    >
</head>

<body>

    <div class="overlay"></div>

    <!-- HEADER -->
    <header>

        

        <nav>
            <!-- <a href="#">Home</a> -->
            <a href="#" class="active">Playlist</a>
            <!-- <a href="#">About</a> -->
        </nav>

        <div class="search-box">
            <i class="fa-solid fa-magnifying-glass"></i>
            <input
                type="text"
                id="search"
                placeholder="Search songs..."
            >
        </div>

    </header>
 

    <!-- MAIN -->
    <main>

        <div class="text">
            <h3>Memories on Every Tape</h3>
            <h1>Dad's Cassette Collection</h1>
        </div>

        <section class="playlist-container">

            <div class="playlist-header " >
                
                <h2>Old Songs Playlist</h2>

                <i class="fa-solid fa-list"></i>

            </div>

            <div id="songList"></div>

        </section>

        

    </main>


    <!-- PLAYER -->
    <div class="player">

        <div class="player-top">

            <!-- CURRENT SONG -->
            <div class="current-song">

                <div class="album">
                    <i class="fa-solid fa-music"></i>
                </div>

                <div class="song-info">
                    <h3 id="currentSongName">Lag Ja Gale</h3>
                    <p id="currentArtist">Lata Mangeshkar</p>
                </div>

                <!-- <button id="likeBtn">
                    <i class="fa-regular fa-heart"></i>
                </button> -->

            </div>


            <!-- CONTROLS -->
            <div class="controls">

                <!-- <button id="shuffleBtn">
                    <i class="fa-solid fa-shuffle"></i>
                </button> -->

                <button id="previousBtn">
                    <i class="fa-solid fa-backward-step"></i>
                </button>

                <button
                    id="playBtn"
                    class="play-btn"
                >
                    <i class="fa-solid fa-play"></i>
                </button>

                <button id="nextBtn">
                    <i class="fa-solid fa-forward-step"></i>
                </button>

                <!-- <button id="repeatBtn">
                    <i class="fa-solid fa-repeat"></i>
                </button> -->

            </div>


            <!-- VOLUME -->
            <div class="volume">

                <button id="muteBtn">
                    <i class="fa-solid fa-volume-high"></i>
                </button>

                <input
                    type="range"
                    id="volume"
                    min="0"
                    max="1"
                    step="0.01"
                    value="0.8"
                >

            </div>

        </div>


        <!-- SEEKBAR -->
        <div class="progress-area">

            <span id="currentTime">00:00</span>

            <input
                type="range"
                id="seekbar"
                min="0"
                max="100"
                value="0"
            >

            <span id="duration">00:00</span>

        </div>

    </div>


    <audio id="audio"></audio>

    <script src="script.js"></script>

</body>

</html>
